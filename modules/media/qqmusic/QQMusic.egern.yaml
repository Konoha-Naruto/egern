name: QQ音乐签到（绿钻·金币·任务）
description: QQ音乐绿钻成长值、金币中心签到、App 每日任务、金币抽奖与红包雨。先在 QQ音乐里打开一次签到页抓 Cookie（抓完把「抓取 Cookie」参数改成 false 即可停抓），之后靠 cron 自动续期、签到、做任务、领奖。
author: MaYIHEI（脚本）/ Konoha-Naruto（Egern 移植）
homepage: https://github.com/MaYIHEI/paperclip/tree/main/app/qqmusic
icon: https://raw.githubusercontent.com/MaYIHEI/pin/refs/heads/main/app/qqmusic.png

env_schema:
  GETCK:
    name: "抓取 Cookie"
    description: "打开QQ音乐签到页抓Cookie，抓到后关闭；不设置时默认开启。关闭后请求脚本直接放行，不拦截也不通知，定时任务不受影响"
    default_value: "true"
    options:
    - "true"
    - "false"

scriptings:
- http_request:
    name: QQ音乐 Cookie
    match: '^https://u6\.y\.qq\.com/cgi-bin/musics\.fcg\?.*(EveryDaySignLvzScore|GetSignInSummary)'
    script_url: https://raw.githubusercontent.com/Konoha-Naruto/egern/main/modules/media/qqmusic/QQMusic.egern.js
    body_required: true
- schedule:
    name: QQ音乐每日任务
    cron: "30 7 * * *"
    script_url: https://raw.githubusercontent.com/Konoha-Naruto/egern/main/modules/media/qqmusic/QQMusic.egern.js
    timeout: 1200
- schedule:
    name: QQ音乐定时金币
    cron: "* 9-10 * * *"
    script_url: https://raw.githubusercontent.com/Konoha-Naruto/egern/main/modules/media/qqmusic/QQMusic.egern.js
    timeout: 1200
- schedule:
    name: QQ音乐红包雨
    cron: "5 0,8,12,16,20,22 * * *"
    script_url: https://raw.githubusercontent.com/Konoha-Naruto/egern/main/modules/media/qqmusic/QQMusic.egern.js
    timeout: 1200

mitm:
  hostnames:
  - u6.y.qq.com
